name: 01 - generate 3d assets

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: install blender
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y blender
          blender --version

      - name: install blender numpy dependency
        run: |
          set -euo pipefail
          blender --background --python-expr 'import ensurepip; ensurepip.bootstrap()'
          BLENDER_PY=/usr/bin/4.0/python/bin/python3.12
          if [ ! -x "$BLENDER_PY" ]; then
            BLENDER_PY=$(find /usr -type f -path '*/4.0/python/bin/python3.12' 2>/dev/null | head -n 1)
          fi
          test -x "$BLENDER_PY"
          "$BLENDER_PY" -m pip install --disable-pip-version-check --no-cache-dir numpy
          "$BLENDER_PY" -c 'import numpy; print("numpy", numpy.__version__)'

      - name: generate assets
        run: |
          set -euo pipefail
          rm -rf generated
          mkdir -p generated
          blender --background --python generator/blender/generate_assets.py
          test -s generated/models/pistol_9mm.glb
          test -s generated/models/carbine_556.glb
          test -s generated/models/pump_shotgun.glb
          test -s generated/maps/training_room.glb

      - name: validate generated files
        run: |
          set -euo pipefail
          find generated -type f -printf '%p %s bytes\n' | sort
          test "$(find generated -type f | wc -l)" -gt 0

      - name: package assets for the next workflow
        run: |
          set -euo pipefail
          mkdir -p build
          tar -czf build/swat-assets.tar.gz generated game
          ls -lh build/swat-assets.tar.gz

      - name: upload temporary workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: swat-generated-assets
          path: build/swat-assets.tar.gz
          retention-days: 1
          compression-level: 0
