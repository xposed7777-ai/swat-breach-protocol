name: 01 - generate 3d assets

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.12"

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: "${{ env.PYTHON_VERSION }}"

      - name: install blender
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y blender
          blender --version

      - name: generate assets
        run: |
          set -euo pipefail
          rm -rf generated
          mkdir -p generated
          blender --background --python generator/blender/generate_assets.py

          test -s generated/models/pistol_9mm.obj
          test -s generated/models/carbine_556.obj
          test -s generated/models/pump_shotgun.obj
          test -s generated/maps/training_room.obj

      - name: copy generated assets into repository tree
        run: |
          set -euo pipefail
          mkdir -p assets/models assets/maps
          cp generated/models/*.obj assets/models/
          cp generated/models/*.mtl assets/models/
          cp generated/maps/*.obj assets/maps/
          cp generated/maps/*.mtl assets/maps/

      - name: validate generated assets
        run: |
          set -euo pipefail
          echo "generated asset files:"
          find assets -type f -printf '%p %s bytes\n' | sort
          test "$(find assets -type f | wc -l)" -ge 8

      - name: commit generated assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/

          if git diff --cached --quiet; then
            echo "no asset changes"
          else
            git commit -m "generate 3d game assets"
            git push origin HEAD:main
          fi
