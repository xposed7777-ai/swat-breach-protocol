name: 02 - build android apk

on:
  workflow_run:
    workflows: ["01 - generate 3d assets"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_VERSION: "4.4.1"
  ANDROID_PLATFORM: "android-35"
  ANDROID_BUILD_TOOLS: "35.0.1"
  ANDROID_HOME: "/usr/local/lib/android/sdk"
  ANDROID_SDK_ROOT: "/usr/local/lib/android/sdk"

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: setup android sdk
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -perm -u+x 2>/dev/null | sort | tail -n 1)
          test -n "$sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null || true
          "$sdkmanager" "platform-tools" "platforms;${ANDROID_PLATFORM}" "build-tools;${ANDROID_BUILD_TOOLS}"
          test -d "$ANDROID_HOME/platforms/${ANDROID_PLATFORM}"
          test -d "$ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS}"
          test -x "$ANDROID_HOME/platform-tools/adb"

      - name: install godot
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --retry-delay 3 -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip -d godot-bin
          mv "godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot-bin/godot
          chmod +x godot-bin/godot
          ./godot-bin/godot --version

      - name: install godot export templates
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --retry-delay 3 -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -q templates.tpz -d templates
          find templates -type f -name 'android_debug.apk' -exec cp {} "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/android_debug.apk" \;
          find templates -type f -name 'android_release.apk' -exec cp {} "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/android_release.apk" \;
          find templates -type f -name 'android_source.zip' -exec cp {} "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/android_source.zip" \;
          printf '%s\n' "${GODOT_VERSION}.stable" > "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/version.txt"
          test -s "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/android_debug.apk"

      - name: configure godot android paths
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
[gd_resource type="EditorSettings" format=3]

[resource]
export/android/android_sdk_path = "$ANDROID_HOME"
export/android/java_sdk_path = "$JAVA_HOME"
EOF

      - name: create debug keystore
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci
          rm -f .ci/debug.keystore
          keytool -genkeypair -v \
            -keystore .ci/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          test -s .ci/debug.keystore

      - name: verify project files
        shell: bash
        run: |
          set -euo pipefail
          test -f project.godot
          test -f export_presets.cfg
          test -f scenes/main.tscn
          test -f scripts/main.gd
          test -d assets
          find assets -type f -print | sort

      - name: godot import and script validation
        shell: bash
        run: |
          set -euo pipefail
          ./godot-bin/godot --headless --path . --editor --quit --import

      - name: headless gameplay smoke test
        shell: bash
        run: |
          set -euo pipefail
          set +e
          timeout 12s ./godot-bin/godot --headless --path . --quit-after 8 >/tmp/godot-smoke.log 2>&1
          rc=$?
          set -e
          cat /tmp/godot-smoke.log
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 124 ]; then
            exit "$rc"
          fi
          if grep -Eqi 'SCRIPT ERROR|PARSE ERROR|ERROR:.*script' /tmp/godot-smoke.log; then
            exit 1
          fi

      - name: build android debug apk
        shell: bash
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/.ci/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          set -euo pipefail
          mkdir -p build
          rm -f build/swat-breach-protocol-debug.apk
          ./godot-bin/godot --headless --path . --export-debug "Android" build/swat-breach-protocol-debug.apk
          test -s build/swat-breach-protocol-debug.apk
          file build/swat-breach-protocol-debug.apk
          ls -lh build/swat-breach-protocol-debug.apk

      - name: upload apk artifact
        uses: actions/upload-artifact@v4
        with:
          name: swat-breach-protocol-debug-apk
          path: build/swat-breach-protocol-debug.apk
          retention-days: 7
          compression-level: 0

      - name: upload apk to gofile
        id: gofile
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl --fail --silent --show-error --location --retry 3 \
            -X POST \
            -F 'file=@build/swat-breach-protocol-debug.apk' \
            https://upload.gofile.io/uploadfile)
          echo "$response" | tee build/gofile-response.json
          url=$(python3 -c 'import json,sys; d=json.load(sys.stdin).get("data",{}); print(d.get("downloadPage") or d.get("directLink") or "")' <<< "$response")
          if [ -z "$url" ]; then
            echo "gofile did not return a download url"
            exit 1
          fi
          printf '%s\n' "$url" > build/gofile-url.txt
          echo "gofile: $url"

      - name: publish build summary
        if: always()
        shell: bash
        run: |
          echo "## swat: breach protocol" >> "$GITHUB_STEP_SUMMARY"
          if [ -f build/swat-breach-protocol-debug.apk ]; then
            echo "apk built successfully" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "apk build failed" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f build/gofile-url.txt ]; then
            echo "gofile apk: $(cat build/gofile-url.txt)" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "generated 3d assets remain in the github workflow artifact; gofile receives the apk only" >> "$GITHUB_STEP_SUMMARY"
