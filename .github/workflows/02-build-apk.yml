name: 02 - build android apk

on:
  workflow_run:
    workflows:
      - "01 - generate 3d assets"
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

env:
  android_platform: "android-35"
  android_build_tools: "35.0.1"

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: setup android sdk
        uses: android-actions/setup-android@v3

      - name: install android build tools
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;${android_platform}" "build-tools;${android_build_tools}"
          test -x "$ANDROID_SDK_ROOT/platform-tools/adb"
          test -d "$ANDROID_SDK_ROOT/platforms/${android_platform}"
          test -d "$ANDROID_SDK_ROOT/build-tools/${android_build_tools}"

      - name: download defold bob
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .defold
          sha="$(curl --fail --silent --show-error --location https://d.defold.com/stable/info.json | python3 -c 'import json,sys; print(json.load(sys.stdin)["sha1"])')"
          test -n "$sha"
          curl --fail --location --retry 4 --retry-delay 3 -o .defold/bob.jar "https://d.defold.com/archive/${sha}/bob/bob.jar"
          test -s .defold/bob.jar
          java -version
          java -jar .defold/bob.jar --version 2>&1 | tee .defold/bob-version.txt
          grep -F "bob.jar version" .defold/bob-version.txt

      - name: verify defold project
        shell: bash
        run: |
          set -euo pipefail
          test -f game.project
          test -f main/main.collection
          test -f main/main.go
          test -f main/main.script
          test -f gui/hud.gui
          test -f gui/hud.gui_script
          test -d assets
          if find . -maxdepth 2 -type f \( -name 'project.godot' -o -name 'export_presets.cfg' \) | grep -q .; then
            echo "error: old godot project files are still present"
            exit 1
          fi

      - name: gameplay smoke test build
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/smoke
          mkdir -p build/smoke
          java -jar .defold/bob.jar \
            --root . \
            --platform x86_64-linux \
            --variant headless \
            --archive \
            --bundle-output build/smoke \
            resolve build bundle
          exe="$(find build/smoke -type f -executable -print -quit)"
          test -n "$exe"
          set +e
          timeout 15s "$exe" > build/smoke/gameplay.log 2>&1
          status=$?
          set -e
          cat build/smoke/gameplay.log
          grep -F "gameplay smoke test: PASS — npc, hud/gui, fire, reload, aim, weapon switch" build/smoke/gameplay.log
          test "$status" -eq 0 || test "$status" -eq 124

      - name: create debug keystore
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .defold
          keytool -genkeypair -v -noprompt \
            -keystore .defold/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: build android debug apk
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/android
          mkdir -p build/android
          java -jar .defold/bob.jar \
            --root . \
            --platform arm64-android \
            --variant debug \
            --bundle-format apk \
            --archive \
            --bundle-output build/android \
            --keystore .defold/debug.keystore \
            --keystore-alias androiddebugkey \
            --keystore-pass android \
            resolve build bundle
          apk="$(find build/android -type f -name '*.apk' -print -quit)"
          test -n "$apk"
          cp "$apk" build/swat-breach-protocol-debug.apk
          test -s build/swat-breach-protocol-debug.apk
          file build/swat-breach-protocol-debug.apk
          ls -lh build/swat-breach-protocol-debug.apk

      - name: upload apk artifact
        uses: actions/upload-artifact@v4
        with:
          name: swat-breach-protocol-debug-apk
          path: build/swat-breach-protocol-debug.apk
          retention-days: 7
          compression-level: 0

      - name: upload apk to gofile
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error --location --retry 3 \
            -X POST \
            -F 'file=@build/swat-breach-protocol-debug.apk' \
            https://upload.gofile.io/uploadfile)"
          printf '%s\n' "$response" > build/gofile-response.json
          url="$(python3 -c 'import json,sys; d=json.load(sys.stdin).get("data",{}); print(d.get("downloadPage") or d.get("directLink") or "")' <<< "$response")"
          test -n "$url"
          printf '%s\n' "$url" > build/gofile-url.txt
          echo "gofile: $url"

      - name: summary
        if: always()
        shell: bash
        run: |
          echo "## swat: breach protocol — defold" >> "$GITHUB_STEP_SUMMARY"
          if [ -s build/swat-breach-protocol-debug.apk ]; then echo "apk: PASS" >> "$GITHUB_STEP_SUMMARY"; else echo "apk: FAIL" >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -s build/gofile-url.txt ]; then echo "gofile: $(cat build/gofile-url.txt)" >> "$GITHUB_STEP_SUMMARY"; fi
          echo "gameplay smoke test: npc, hud/gui, fire, reload, aim, weapon switch" >> "$GITHUB_STEP_SUMMARY"
          echo "gofile receives APK only; game assets stay in the repository" >> "$GITHUB_STEP_SUMMARY"
