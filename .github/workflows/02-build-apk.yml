name: 02 - build android apk

on:
  workflow_run:
    workflows:
      - "01 - generate 3d assets"
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

env:
  godot_version: "4.4.1"
  android_home: "/usr/local/lib/android/sdk"
  android_sdk_root: "/usr/local/lib/android/sdk"
  ANDROID_HOME: "/usr/local/lib/android/sdk"
  ANDROID_SDK_ROOT: "/usr/local/lib/android/sdk"
  android_platform: "android-35"
  android_build_tools: "35.0.1"

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: setup android sdk
        shell: bash
        run: |
          set -euo pipefail
          test -d "$ANDROID_HOME"
          sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -perm -u+x 2>/dev/null | sort | tail -n 1)"
          test -n "$sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null || true
          "$sdkmanager" "platform-tools" "platforms;${android_platform}" "build-tools;${android_build_tools}"
          test -x "$ANDROID_HOME/platform-tools/adb"
          "$ANDROID_HOME/platform-tools/adb" start-server

      - name: install godot
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --retry-delay 3 -o godot.zip "https://github.com/godotengine/godot/releases/download/${godot_version}-stable/Godot_v${godot_version}-stable_linux.x86_64.zip"
          unzip -q godot.zip -d godot-bin
          mv "godot-bin/Godot_v${godot_version}-stable_linux.x86_64" godot-bin/godot
          chmod +x godot-bin/godot
          ./godot-bin/godot --version

      - name: install godot export templates
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --retry-delay 3 -o templates.tpz "https://github.com/godotengine/godot/releases/download/${godot_version}-stable/Godot_v${godot_version}-stable_export_templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates/${godot_version}.stable"
          unzip -q templates.tpz -d templates
          find templates -type f -name 'android_debug.apk' -exec cp {} "$HOME/.local/share/godot/export_templates/${godot_version}.stable/android_debug.apk" \;
          find templates -type f -name 'android_release.apk' -exec cp {} "$HOME/.local/share/godot/export_templates/${godot_version}.stable/android_release.apk" \;
          find templates -type f -name 'android_source.zip' -exec cp {} "$HOME/.local/share/godot/export_templates/${godot_version}.stable/android_source.zip" \;
          printf '%s\n' "${godot_version}.stable" > "$HOME/.local/share/godot/export_templates/${godot_version}.stable/version.txt"
          test -s "$HOME/.local/share/godot/export_templates/${godot_version}.stable/android_debug.apk"

      - name: create debug keystore
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci
          rm -f .ci/debug.keystore
          keytool -genkeypair -v -keystore .ci/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          test -s .ci/debug.keystore

      - name: verify project
        shell: bash
        run: |
          set -euo pipefail
          test -f project.godot
          test -f export_presets.cfg
          test -f scenes/main.tscn
          test -f scripts/main.gd
          test -f scripts/gameplay_smoke_test.gd
          test -d assets

      - name: import project
        shell: bash
        run: |
          set -euo pipefail
          ./godot-bin/godot --headless --path . --editor --quit --import

      - name: gameplay smoke test
        shell: bash
        run: |
          set -euo pipefail
          ./godot-bin/godot --headless --path . --script res://scripts/gameplay_smoke_test.gd

      - name: android export test
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          rm -f /tmp/swat-export-test.apk
          ./godot-bin/godot --headless --path . --export-debug "Android" /tmp/swat-export-test.apk
          test -s /tmp/swat-export-test.apk
          file /tmp/swat-export-test.apk

      - name: build android debug apk
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          rm -f build/swat-breach-protocol-debug.apk
          ./godot-bin/godot --headless --path . --export-debug "Android" build/swat-breach-protocol-debug.apk
          test -s build/swat-breach-protocol-debug.apk
          file build/swat-breach-protocol-debug.apk
          ls -lh build/swat-breach-protocol-debug.apk

      - name: upload apk artifact
        uses: actions/upload-artifact@v4
        with:
          name: swat-breach-protocol-debug-apk
          path: build/swat-breach-protocol-debug.apk
          retention-days: 7
          compression-level: 0

      - name: upload apk to gofile
        id: gofile
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error --location --retry 3 -X POST -F 'file=@build/swat-breach-protocol-debug.apk' https://upload.gofile.io/uploadfile)"
          printf '%s\n' "$response" > build/gofile-response.json
          url="$(python3 -c 'import json,sys; d=json.load(sys.stdin).get("data",{}); print(d.get("downloadPage") or d.get("directLink") or "")' <<< "$response")"
          test -n "$url"
          printf '%s\n' "$url" > build/gofile-url.txt
          echo "gofile: $url"

      - name: build summary
        if: always()
        shell: bash
        run: |
          echo "## swat: breach protocol" >> "$GITHUB_STEP_SUMMARY"
          if [ -f build/swat-breach-protocol-debug.apk ]; then echo "apk: built" >> "$GITHUB_STEP_SUMMARY"; else echo "apk: failed" >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -f build/gofile-url.txt ]; then echo "gofile apk: $(cat build/gofile-url.txt)" >> "$GITHUB_STEP_SUMMARY"; fi
          echo "assets: remain on github artifacts; gofile receives apk only" >> "$GITHUB_STEP_SUMMARY"
